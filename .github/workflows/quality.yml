name: quality

on:
  push:
  pull_request:

# Actions are pinned to full commit SHAs, with the version in a comment, rather than floating on a
# tag. A tag is a name someone can move; a SHA is the code that actually ran. This matches Aemi's
# own workflows, and the drift between the two used to be a bug rather than a policy — see below.
env:
  SWIFT_VERSION: "6.4"

jobs:
  gate:
    # macos-26 matches the package's declared floor (.macOS(.v26)). Testing on the oldest supported
    # system is the point: it is the only way to notice that something quietly started using an API
    # newer than the floor it claims to support. It also matches the floors of TerminalKit
    # and Aemi's own workflows.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # setup-swift v2 cannot install Swift 6.4: its version table stops at 6.2.1, so it failed with
      # "Version 6.4 is not available". v3 installs through swiftly, which resolves any published
      # toolchain, and 6.4 is published.
      - uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3.0.0-beta.1
        with:
          swift-version: ${{ env.SWIFT_VERSION }}
      - name: Swift version
        run: swift --version
      - name: SwiftLint (metrics)
        # The runner image already ships SwiftLint; install only when it is missing.
        run: |
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi
          swiftlint version
      - name: Quality gate
        # --check: fail if the tree is not already canonical, so a formatting drift is a red build
        # rather than something a reviewer has to notice.
        run: Scripts/quality.sh --check
