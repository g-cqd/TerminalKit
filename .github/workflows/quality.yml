name: quality

on:
  push:
  pull_request:

# Pinned to full commit SHAs with the version in a comment, matching Aemi's workflows and `ask`'s:
# a tag is a name someone can move, a SHA is the code that ran.
env:
  SWIFT_VERSION: "6.4"

jobs:
  gate:
    # macos-26 matches the package's declared floor (.macOS(.v26)).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: ${{ env.SWIFT_VERSION }}
      - name: SwiftLint (metrics)
        run: brew install swiftlint
      - name: Quality gate
        # --check: fail if the tree is not already canonical, so a formatting drift is a red build
        # rather than something a reviewer has to notice.
        run: Scripts/quality.sh --check