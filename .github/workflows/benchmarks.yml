name: benchmarks

on:
  push:
    branches: [main]
  pull_request:

# Roadmap 0006, ADR-0017. Times this commit against its base on the same runner, with the same
# benchmark code, and fails on a regression beyond the thresholds in Benchmarks/Sources/BenchmarkSupport.
# Comparing two runs on one machine, rather than against numbers recorded elsewhere, is what makes a
# shared runner usable at all: its absolute speed is not the reference machine's.
env:
  SWIFT_VERSION: "6.4"

jobs:
  regression:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3.0.0-beta.1
        with:
          swift-version: ${{ env.SWIFT_VERSION }}
      - name: Choose the base
        id: base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "sha=$base" >> "$GITHUB_OUTPUT"
          else
            echo "No base commit to compare against; skipping."
          fi
      - name: Compare against the base
        if: steps.base.outputs.sha != ''
        run: Scripts/benchmarks.sh compare "${{ steps.base.outputs.sha }}"
