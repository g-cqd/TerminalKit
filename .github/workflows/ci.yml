name: CI

# swift-ci plans and runs the checks from .ci/action.json (https://github.com/g-cqd/swift-ci); .ci/README.md lists
# what runs when. `.ci/swift-ci local` runs the same checks on a developer's machine.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Checks
    uses: g-cqd/swift-ci/.github/workflows/swift-ci.yml@27f96f088df78b2a7c988356107c34e25c3d59d2 # swift-ci 27f96f0
    permissions:
      contents: write # reusable publish permission; this package publishes no archives

  benchmarks:
    # Roadmap 0006, ADR-0017. Times this commit against its base on the same runner, with the same benchmark code,
    # and fails on a regression beyond the thresholds in Benchmarks/Sources/BenchmarkSupport. Comparing two runs on
    # one machine, rather than against numbers recorded elsewhere, is what makes a shared runner usable at all. After
    # the checks, so a tree that does not pass its tests is not timed.
    name: Performance · Compare Against Base · macOS
    needs: ci
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SWIFT_VERSION: "6.4.1"
    steps:
      - name: Setup · Check Out Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup · Install Swift 6.4.1
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3.0.0-beta.1
        with:
          swift-version: ${{ env.SWIFT_VERSION }}
      - name: Cache · Restore Benchmark Build
        id: bench-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Benchmarks/.build
          key: bench-${{ runner.os }}-${{ env.SWIFT_VERSION }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Benchmarks/Package.swift', 'Benchmarks/Package.resolved') }}
          restore-keys: bench-${{ runner.os }}-${{ env.SWIFT_VERSION }}-
      - name: Plan · Choose Base Commit
        id: base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "sha=$base" >> "$GITHUB_OUTPUT"
          else
            echo "No base commit to compare against; skipping."
          fi
      - name: Performance · Compare Against Base
        if: steps.base.outputs.sha != ''
        # A regression has to reproduce. The 25th-percentile gate reads a sub-microsecond benchmark in 41.67 ns clock
        # ticks, so 417 ns against 500 ns is ten ticks against twelve: +19 % against a 15 % threshold, from one tick of
        # noise, on a pull request that changed no source. Two comparisons that both exceed the thresholds are a
        # regression; one is noise. The second measures in the other order: load that drifts during a run favours
        # one side, so the same order twice can "reproduce" a regression with no code changed (2026-11-04: a commit
        # that only moved pins to CI-only revisions failed both base-first attempts).
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          if Scripts/benchmarks.sh compare "$BASE"; then exit 0; fi
          echo "::warning::attempt 1 (base first) exceeded the thresholds; a regression must reproduce"
          if Scripts/benchmarks.sh compare "$BASE" --head-first; then exit 0; fi
          echo "::warning::attempt 2 (head first) exceeded the thresholds too"
          exit 1
      - name: Cache · Save Benchmark Build
        if: ${{ always() && github.ref == 'refs/heads/main' && steps.bench-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Benchmarks/.build
          key: bench-${{ runner.os }}-${{ env.SWIFT_VERSION }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Benchmarks/Package.swift', 'Benchmarks/Package.resolved') }}
